name: Staging Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Push image tags to the registry
        required: true
        type: boolean
        default: false
      image_repo:
        description: Image repository (for example ghcr.io/org/dissertation-backend)
        required: false
        type: string
        default: ''
      image_alias:
        description: Mutable alias tag to publish
        required: false
        type: string
        default: staging

permissions:
  contents: read
  packages: write

jobs:
  staging-publish:
    name: staging-publish
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dissertation_auth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: dissertation_auth_db
      IMAGE_REPO: ${{ inputs.image_repo != '' && inputs.image_repo || format('ghcr.io/{0}/dissertation-backend', github.repository_owner) }}
      IMAGE_ALIAS: ${{ inputs.image_alias }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure staging image repository is configured
        run: |
          if [ -z "$IMAGE_REPO" ]; then
            echo "Provide image_repo input before running this workflow."
            exit 1
          fi

      - name: Run deploy verification gate
        run: npm run verify:deploy

      - name: Tag staging image (dry run)
        if: ${{ inputs.publish == false }}
        run: npm run docker:tag:ci

      - name: Login to registry
        if: ${{ inputs.publish == true }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish staging image tags
        if: ${{ inputs.publish == true }}
        run: npm run docker:publish:ci
