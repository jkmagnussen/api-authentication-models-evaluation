name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate documentation artifacts
        run: npm run ci:docs

      - name: Upload generated artifacts snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-artifacts
          path: |
            docs/generated
            docs/performance-results/analysis.md
            docs/performance-results/statistical-summary.csv
            ai-generated/results/ai-samples-summary.csv
            ai-generated/results/ai-samples-failure-rates.csv
          if-no-files-found: error

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm run ci:tests

  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - docs
      - tests
    if: always()

    steps:
      - name: Verify required jobs passed
        run: |
          if [ "${{ needs.docs.result }}" != "success" ] || [ "${{ needs.tests.result }}" != "success" ]; then
            echo "At least one required job failed."
            echo "docs=${{ needs.docs.result }}, tests=${{ needs.tests.result }}"
            exit 1
          fi
          echo "All required jobs passed."
